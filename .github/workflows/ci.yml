name: ci

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'

jobs:
  buildx:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: arm64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # No registry login: this job never pushes, it only builds and warms
      # the GitHub layer cache. Dependabot runs get no Actions secrets, so a
      # login step here can only fail. Pushing happens in build.yml on tags.
      - name: Cache Docker layers (GitHub cache backend)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
